# Partner addresses, routes, and topics. Copy to config.yaml for local
# overrides or point GUARDIAN_CONFIG at another file. Do not put HMAC keys here.

http:
  host: "0.0.0.0"
  port: 8000

routes:
  - operation: publish_reading
    method: POST
    path: /v1/readings
    caller: twin
  - operation: report_actuator_state
    method: POST
    path: /v1/actuator-states
    caller: twin
  - operation: ack_command
    method: POST
    path: /v1/command-acks
    caller: twin
  - operation: request_verdict
    method: POST
    path: /v1/verdicts/query
    caller: brain
  - operation: get_device_status
    method: POST
    path: /v1/devices/status
    caller: brain
  - operation: report_decision
    method: POST
    path: /v1/decisions
    caller: brain
  - operation: health
    method: GET
    path: /health
    caller: any

mqtt:
  host: localhost
  port: 1883
  username: ""
  password: ""
  topics:
    - operation: publish_reading
      topic: city/twin/readings/{device_id}
      direction: inbound
    - operation: report_actuator_state
      topic: city/twin/actuators/{device_id}
      direction: inbound
    - operation: ack_command
      topic: city/twin/acks
      direction: inbound
    - operation: publish_verdict
      topic: city/guardian/verdicts
      direction: outbound
    - operation: publish_command
      topic: city/guardian/commands
      direction: outbound

partners:
  twin:
    base_url: http://127.0.0.1:8001
  brain:
    base_url: http://127.0.0.1:8002

guardian:
  base_url: http://127.0.0.1:8000
