# Guardian Configuration Specification (R1: Configurable Partner Endpoints)

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  cors_origins: ["*"]
  # disabled by default; use local for loopback jury tooling or demo for an
  # explicitly exposed demonstration endpoint.
  timeline_mode: "disabled"

partners:
  twin:
    adapter: "rest"
    type: "rest"
    listen_path: "/api/v1/telemetry"
    identity: "twin:S01"
    mqtt:
      host: "localhost"
      # 8883 is MQTT over TLS and matches tls_enabled: true. A partner broker may
      # use another TLS port; MQTT_PORT overrides. Plaintext example:
      # port: 1883 with tls_enabled: false (local brokers only).
      port: 8883
      topic: "sensors/telemetry/raw"
      tls_enabled: true
      # Keep certificate paths outside this file when they are sensitive.
      ca_cert: null
      client_cert: null
      client_key: null
  brain:
    adapter: "rest"
    type: "rest"
    endpoint: "http://localhost:8002/api/v1/brain/ingest"
    timeout_seconds: 10.0
    retry_count: 0

adapters:
  twin: "rest"
  brain: "rest"

# Priority: explicit environment variables > this YAML file > safe defaults.
# HMAC keys and other secrets must be supplied through environment variables or
# the configured secrets mechanism; never place them in this YAML file.

security:
  enabled: true
  freshness_window_seconds: 300
  max_future_skew_seconds: 5
  max_message_bytes: 65536
  rate_per_source: 5
  rate_burst: 20
  flood_threshold: 10
  replay_cache_size: 10000

detection:
  water_level:
    spike_threshold_cm: 200.0
    max_physical_limit_cm: 1000.0
    min_physical_limit_cm: 0.0
    max_rate_of_change_cm_per_sec: 15.0
  traffic:
    max_speed_kmh: 250.0
    max_density_vpm: 500.0

# Trust policy applied by the Core TrustAssessor. Only these keys are accepted;
# an unknown key under trust: is a startup error.
trust:
  isolate_threshold: 0.4        # score below this -> UNTRUSTED (ISOLATE)
  quarantine_threshold: 0.7     # score below this -> SUSPICIOUS (QUARANTINE)
  recovery_clean_readings: 3    # clean readings before an isolated device recovers
  full_confidence_readings: 10  # clean readings before confidence is fully restored
  policy_version: "1.0"

audit:
  timeline_channel: "/ws/timeline"
  log_directory: "../logs"      # same setting as AUDIT_LOG_DIR / log_dir
  sqlite_path: "event_store.db" # reserved: accepted, not consumed yet

