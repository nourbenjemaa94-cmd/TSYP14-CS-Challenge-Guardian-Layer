version: '3.8'

services:
  guardian:
    build:
      context: ./guardian
      dockerfile: Dockerfile
    container_name: guardian-gateway
    ports:
      - "8000:8000"
    environment:
      - GUARDIAN_ENV=production
      - GUARDIAN_HOST=0.0.0.0
      - GUARDIAN_PORT=8000
      - CITY_BRAIN_URL=http://city-brain:8002/api/v1/brain/ingest
      - API_AUTH_SECRET=triplet07-supersecret-token
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - triplet-net

  twin-mock:
    build:
      context: ./guardian
      dockerfile: Dockerfile
    container_name: twin-mock-node
    command: python mocks/mock_twin.py
    environment:
      - GUARDIAN_URL=http://guardian:8000/api/v1/telemetry
    depends_on:
      - guardian
    networks:
      - triplet-net

  brain-mock:
    build:
      context: ./guardian
      dockerfile: Dockerfile
    container_name: brain-mock-node
    command: python mocks/mock_brain.py
    ports:
      - "8002:8002"
    environment:
      - BRAIN_PORT=8002
    networks:
      - triplet-net

networks:
  triplet-net:
    driver: bridge
