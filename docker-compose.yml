version: '3.8'

services:
  guardian:
    build:
      context: ./guardian
      dockerfile: Dockerfile
    container_name: guardian-gateway
    ports:
      - "8000:8000"
    env_file:
      - ./guardian/.env
    environment:
      - GUARDIAN_ENV=production
      - GUARDIAN_HOST=0.0.0.0
      - GUARDIAN_PORT=8000
      - CITY_BRAIN_URL=http://city-brain:8002/api/v1/brain/ingest
      - GUARDIAN_LLM_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - triplet-net

  twin-mock:
    build:
      context: ./guardian
      dockerfile: Dockerfile
    container_name: twin-mock-node
    command: python -m mocks.mock_twin
    environment:
      - GUARDIAN_URL=http://guardian:8000/api/v1/telemetry
    depends_on:
      - guardian
    networks:
      - triplet-net

  brain-mock:
    build:
      context: ./guardian
      dockerfile: Dockerfile
    container_name: brain-mock-node
    command: python -m mocks.mock_brain
    ports:
      - "8002:8002"
    environment:
      - BRAIN_PORT=8002
    networks:
      - triplet-net

  ollama:
    image: ollama/ollama:0.40.14
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama

networks:
  triplet-net:
    driver: bridge

volumes:
  ollama-models:
